name: profile cards

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -F login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
                repositories(first: 100, ownerAffiliations: OWNER, isFork: false, orderBy: {field: STARGAZERS, direction: DESC}) {
                  nodes {
                    name
                    description
                    url
                    stargazerCount
                    forkCount
                    primaryLanguage { name color }
                  }
                }
              }
            }' > "$RUNNER_TEMP/raw.json"
          jq --arg login "$LOGIN" '
            .data.user as $u
            | $u.contributionsCollection.contributionCalendar as $cal
            | {
                login: $login,
                total: $cal.totalContributions,
                days: [$cal.weeks[].contributionDays[] | {date, count: .contributionCount}],
                repos: [$u.repositories.nodes[] | {
                  name, description, url,
                  stars: .stargazerCount,
                  forks: .forkCount,
                  language: .primaryLanguage.name,
                  language_color: .primaryLanguage.color
                }]
              }' "$RUNNER_TEMP/raw.json" > data/contributions.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install fonttools brotli
          python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
