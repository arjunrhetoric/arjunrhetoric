<svg xmlns="http://www.w3.org/2000/svg" width="280" height="150" viewBox="0 0 280 150"><title>portfolio: arjunrhetoric.vercel.app</title><style>@font-face{font-family:"ISerif";src:url(data:font/woff;base64,) format("woff");font-weight:400;font-style:normal}@font-face{font-family:"IInter";src:url(data:font/woff;base64,) format("woff");font-weight:100 900;font-style:normal}.serif{font-family:ISerif,Georgia,serif}.sans{font-family:IInter,Arial,sans-serif}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}.ping{animation:ping 2.4s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes pop{from{opacity:0;transform:scale(.3)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes ping{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="279" height="149" rx="18" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="1"/><text x="24" y="74" font-size="36" font-weight="400" fill="#f5f5f5" text-anchor="start" style="--d:0.45s" class="serif rise">portfolio</text><text x="256" y="74" font-size="24" font-weight="400" fill="#f16a4b" text-anchor="end" style="--d:0.55s" class="sans rise">→</text><text x="24" y="102" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="start" style="--d:0.60s" class="sans rise">arjunrhetoric.vercel.app</text><rect x="24" y="120" width="28" height="3" rx="1.5" fill="#f16a4b" style="--d:0.70s" class="growx"/></svg>
