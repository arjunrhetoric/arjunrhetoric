<svg xmlns="http://www.w3.org/2000/svg" width="280" height="150" viewBox="0 0 280 150"><title>portfolio: arjunrhetoric.vercel.app</title><style>@font-face{font-family:"ISerif";src:url(data:font/woff;base64,) format("woff");font-weight:400;font-style:normal}@font-face{font-family:"IInter";src:url(data:font/woff;base64,) format("woff");font-weight:100 900;font-style:normal}.serif{font-family:ISerif,Georgia,serif}.sans{font-family:IInter,Arial,sans-serif}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}90%{transform:translateY(-1px) scale(1.01) rotate(.2deg)}100%{opacity:1;transform:none}}@keyframes slidein{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}@keyframes arrowin{0%{opacity:0;transform:translateX(-30px)}60%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:none}}@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}@keyframes sheen{0%{transform:translateX(-260px) skewX(-20deg)}22%,100%{transform:translateX(1200px) skewX(-20deg)}}@keyframes ring{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}.fade{animation:fade .9s ease-out both;animation-delay:var(--d,0s)}.pop{transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both;animation-delay:var(--d,0s)}.tilein{transform-box:fill-box;transform-origin:50% 60%;animation:tilein 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}.slidein{transform-box:fill-box;animation:slidein .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}.arrowin{transform-box:fill-box;animation:arrowin .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}.pulse{animation:pulse 1.6s ease-in-out 3;animation-delay:var(--d,0s)}.nudge{transform-box:fill-box;animation:nudge 1.8s ease-in-out 2;animation-delay:var(--d,0s)}.sheen{animation:sheen 6s ease-in-out 1 both;animation-delay:var(--d,0s)}.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1.1s ease-out both;animation-delay:var(--d,0s)}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none!important}}</style><g style="--d:0.35s" class="tilein"><rect x="0.5" y="0.5" width="279" height="149" rx="18" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="1"/><text x="24" y="74" font-size="36" font-weight="400" fill="#f5f5f5" text-anchor="start" style="--d:0.50s" class="serif slidein">portfolio</text><text x="256" y="74" font-size="24" font-weight="400" fill="#f16a4b" text-anchor="end" style="--d:0.70s" class="sans arrowin">→</text><text x="24" y="102" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="start" style="--d:0.65s" class="sans fade">arjunrhetoric.vercel.app</text><rect x="24" y="120" width="28" height="3" rx="1.5" fill="#f16a4b" style="--d:0.85s" class="growx"/></g></svg>
